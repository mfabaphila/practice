<!doctype html>

<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title></title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <fieldset>
      <legend>Budget Advisor</legend>

      <div class="form">
        <div class="login-items">
          <h3>Enter Login Details</h3>
          <div class="login-items">
            <label>Name</label>
            <input id="name" type="name" />
          </div>

          <div class="login-items">
            <label>username</label>
            <input id="username" type="name" />
          </div>

          <div class="login-items">
            <label>password</label>
            <input id="password" type="password" />
          </div>
          <button id="loginBtn">login</button> OR
          <button id="signBtn">Sign-up</button>
        </div>

        <div class="income-items">
          <h3>Enter Income Details</h3>
          <div class="income-items">
            <label>Salary</label>
            <input id="salary" type="number" />
          </div>

          <div class="income-items">
            <label>freelancing</label>
            <input id="freelancing" type="number" />
          </div>

          <div class="income-items">
            <label>Bonus</label>
            <input id="bonus" type="number" />
          </div>

          <div class="income-items">
            <label>Rent Income</label>
            <input id="rentIncome" type="number" />
          </div>

          <h3>Enter Expenses Details</h3>

          <div class="income-items">
            <label>Rent or Bond</label>
            <input id="rentBond" type="number" />
          </div>

          <div class="income-items">
            <label>Food</label>
            <input id="food" type="number" />
          </div>

          <div class="income-items">
            <label>Transport</label>
            <input id="transport" type="number" />
          </div>

          <div class="income-items">
            <label>Utilities</label>
            <input id="utilities" type="number" />
          </div>

          <div class="income-items">
            <label>Subscriptions</label>
            <input id="subscriptions" type="number" />
          </div>

          <div class="income-items">
            <label>Debt</label>
            <input id="debt" type="number" />
          </div>

          <button id="calculateBtn">Calculate</button>
        </div>

        <div class="results-items">
          <h3>Check Results</h3>
          <div class="results-items">
            <label>total income</label>
            <input id="totalIncome" type="number" />
          </div>

          <div class="results-items">
            <label>totalExpenses</label>
            <input id="totalExpenses" type="number" />
          </div>

          <div class="results-items">
            <label>Remaining</label>
            <input id="remaining" type="text" />
          </div>

          <div class="results-items">
            <label>Remianing Percentage</label>
            <input id="remainingPercentage" type="text" />
          </div>
        </div>
      </div>
    </fieldset>
  </body>
</html>
